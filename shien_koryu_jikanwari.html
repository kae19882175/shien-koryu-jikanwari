<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支援級の時間割メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 上に学校・児童生徒の切替、中央に時間割の表と編集パネル。印刷用のシートは画面とは別の白黒設計。 */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --ink:#1b2a2d; --muted:#586b6f; --line:#ccd7d5; --soft:#e7eeec;
  --accent:#0e6a6d; --accent-ink:#ffffff;
  --exch:#1d57a6; --exch-bg:#e7effb;
  --sup:#2b7a4b; --sup-bg:#e4f3ea;
  --oth:#8a5a00; --oth-bg:#fbf0d6;
  --unset:#b3261e; --unset-bg:#fdecea;
  --warn:#8a5a00; --warn-bg:#fff4d6;
  --font-d:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  --font-b:'BIZ UDPGothic','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a1b; --surface:#1a2425; --ink:#e4eeed; --muted:#9ab0b2; --line:#33474a; --soft:#223133;
    --accent:#4fc3c6; --accent-ink:#082123;
    --exch:#8bb7f0; --exch-bg:#1c2a40; --sup:#7ccf9b; --sup-bg:#18301f;
    --oth:#e5b85c; --oth-bg:#352a10; --unset:#ff8f86; --unset-bg:#3a1c1a;
    --warn:#e5b85c; --warn-bg:#352a10; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a1b; --surface:#1a2425; --ink:#e4eeed; --muted:#9ab0b2; --line:#33474a; --soft:#223133;
  --accent:#4fc3c6; --accent-ink:#082123;
  --exch:#8bb7f0; --exch-bg:#1c2a40; --sup:#7ccf9b; --sup-bg:#18301f;
  --oth:#e5b85c; --oth-bg:#352a10; --unset:#ff8f86; --unset-bg:#3a1c1a;
  --warn:#e5b85c; --warn-bg:#352a10; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;padding:8px 0 10px}
.top h1{font-size:24px;letter-spacing:.02em}
.top .sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:8px 8px 0 0;font-weight:700;color:var(--muted);position:relative;top:2px;border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--unset);color:#fff;font-size:12px;text-align:center;margin-left:4px}
.badge.w{background:var(--oth)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel h2{font-size:18px;margin-bottom:6px}
.panel h3{font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1}
.small{font-size:12px;color:var(--muted)}
.help{color:var(--muted);font-size:13px;margin:4px 0 10px}
.btn{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);padding:6px 12px;border-radius:8px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dng{border-color:var(--unset);color:var(--unset)}
.btn.dng.sure{background:var(--unset);color:#fff}
.btn.sm{padding:2px 8px;font-size:12px}
.seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:700;color:var(--accent)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
input[type=text],select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;min-width:0;max-width:100%}
input[type=text].s{width:5.5em}
input[type=text].m{width:11em}
textarea{width:100%;min-height:54px}
label.chk{display:inline-flex;gap:5px;align-items:center}
.scroll{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;min-width:760px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.tbl th{font-size:12px;color:var(--muted);background:var(--soft);position:sticky;top:0}
table.tbl tr.grp td{background:var(--soft);font-weight:700;font-family:var(--font-d)}
table.tbl tr.hl td{background:var(--warn-bg)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid currentColor;white-space:nowrap}
.pill.exchange{color:var(--exch);background:var(--exch-bg)}
.pill.support{color:var(--sup);background:var(--sup-bg)}
.pill.other{color:var(--oth);background:var(--oth-bg);border-style:dashed}
.pill.unset{color:var(--unset);background:var(--unset-bg)}
.pill.er{color:#fff;background:var(--unset);border-color:var(--unset)}
.pill.wn{color:var(--warn);background:var(--warn-bg)}
/* ===== 時間割の表 ===== */
table.tt{width:100%;border-collapse:collapse;table-layout:fixed;min-width:680px}
table.tt th,table.tt td{border:1.5px solid var(--line);vertical-align:top;padding:3px}
table.tt thead th{background:var(--soft);font-family:var(--font-d);padding:6px}
table.tt th.rh{width:78px;background:var(--soft);font-size:13px;text-align:center;vertical-align:middle}
table.tt td{height:var(--rh,86px)}
table.tt td.clk{cursor:pointer}
table.tt td.clk:hover{background:var(--soft)}
table.tt td.sel{outline:3px solid var(--accent);outline-offset:-3px}
.plus{color:var(--line);font-size:20px;display:block;text-align:center;padding-top:14px}
.it{border:1.5px solid var(--line);border-radius:6px;padding:2px 5px;margin:2px 0;background:var(--surface);line-height:1.35}
.it .l1{display:flex;gap:5px;align-items:center}
.it .nm{font-size:13px}
.it .l2{font-size:12px;margin-left:24px}
.it .l3{margin-left:24px;display:flex;flex-wrap:wrap;gap:3px;margin-top:1px}
.it .nt{margin-left:24px;font-size:11px;color:var(--muted)}
.sym{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700;flex:none;line-height:1}
.w-exchange{border:2px solid var(--exch);background:var(--exch-bg)} .w-exchange .sym{background:var(--exch);color:#fff;border-color:var(--exch)}
.w-support{border-color:var(--sup);background:var(--sup-bg)} .w-support .sym{color:var(--sup)}
.w-other{border:1.5px dashed var(--oth);background:var(--oth-bg)} .w-other .sym{color:var(--oth);border-style:dashed}
.w-unset{border-color:var(--unset);background:repeating-linear-gradient(135deg,var(--unset-bg) 0 6px,transparent 6px 8px)} .w-unset .sym{color:var(--unset)}
.tag{font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}
.tag.ex{color:var(--oth);font-weight:700} .tag.df{color:var(--unset);font-weight:700}
.mm{font-size:11px;color:var(--muted);border-top:1px dotted var(--line);margin-top:2px;padding-top:1px}
table.tt.big .nm{font-size:17px}
table.tt.big .l2{font-size:15px;margin-left:26px}
table.tt.big .sym{width:23px;height:23px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12.5px;align-items:center}
.legend span.k{display:inline-flex;gap:5px;align-items:center}
/* ===== 編集パネル ===== */
.editor{border:2px solid var(--accent);border-radius:10px;padding:12px;margin-top:14px;background:var(--surface)}
.editor .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ecard{border:1.5px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.ecard dl{margin:6px 0;display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:13px}
.ecard dt{color:var(--muted)} .ecard dd{margin:0}
.excform{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.notebox{background:var(--warn-bg);border-left:4px solid var(--warn);padding:6px 10px;border-radius:4px;font-size:13px;margin:6px 0}
/* ===== 児童生徒 ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.row>label{display:flex;gap:6px;align-items:center}
.issue{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.issue .msg{flex:1;min-width:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.ok{color:var(--sup);font-weight:700}
/* ===== 印刷シート（白黒で区別できる設計） ===== */
.sheetbox{overflow-x:auto;background:var(--soft);padding:12px;border-radius:8px}
.sheet{background:#fff;color:#000;font-family:var(--font-b);margin:0 auto;padding:6mm;box-shadow:0 1px 8px rgba(0,0,0,.25)}
.sheet.land{width:297mm;min-height:210mm}
.sheet.port{width:210mm;min-height:297mm}
.sheet h2{font-size:18pt;margin:0 0 2mm;color:#000}
.sheet .meta{font-size:10pt;margin-bottom:3mm;display:flex;justify-content:space-between;gap:8mm}
.sheet table.tt{min-width:0;border-collapse:collapse}
.sheet table.tt th,.sheet table.tt td{border:1.5px solid #000;background:#fff;color:#000}
.sheet table.tt thead th,.sheet table.tt th.rh{background:#e4e4e4}
.sheet table.tt td{height:var(--rh,18mm);padding:1mm}
.sheet table.tt td.clk:hover{background:#fff}
.sheet .it{border:1.5px solid #000;background:#fff;color:#000;border-radius:2mm;padding:.6mm 1.2mm;margin:.8mm 0}
.sheet .it .nm{font-size:10pt}
.sheet .it .l2{font-size:8.5pt;margin-left:6mm}
.sheet .it .nt{color:#000;font-size:7.5pt;margin-left:6mm}
.sheet .sym{border:1.5px solid #000;background:#fff;color:#000;width:5mm;height:5mm;font-size:8pt}
.sheet .w-exchange{border:3px double #000;background:#fff} .sheet .w-exchange .sym{background:#000;color:#fff;border-color:#000}
.sheet .w-support{border:1.5px solid #000;background:#fff}
.sheet .w-other{border:1.5px dashed #000;background:#fff} .sheet .w-other .sym{border-style:dashed}
.sheet .w-unset{border:1.5px solid #000;background:repeating-linear-gradient(135deg,#fff 0 1.2mm,#bdbdbd 1.2mm 1.5mm)} .sheet .w-unset .sym{background:#fff}
.sheet .tag{border:1px solid #000;color:#000;background:#fff;font-size:7pt}
.sheet .tag.ex{font-weight:700;border-width:1.5px} .sheet .tag.df{font-weight:700;text-decoration:underline}
.sheet .mm{color:#000;border-top:1px dotted #000;font-size:7.5pt}
.sheet table.tt.big .nm{font-size:17pt} .sheet table.tt.big .l2{font-size:13pt;margin-left:8mm} .sheet table.tt.big .sym{width:7mm;height:7mm;font-size:11pt}
.sheet .legend{font-size:8.5pt;color:#000;margin-top:2.5mm}
.sheet .legend .k{gap:1.5mm}
.sheet table.pl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
.sheet table.pl th,.sheet table.pl td{border:1.2px solid #000;padding:1mm 1.5mm;vertical-align:middle;word-break:break-all}
.sheet table.pl th{background:#e4e4e4;font-size:8.5pt}
.sheet table.pl tr.grp td{background:#cfcfcf;font-weight:700}
.sheet table.pl .cell{display:flex;gap:1mm;align-items:center;flex-wrap:wrap}
.sheet .iss{font-size:9pt;margin-top:3mm;border:1.5px solid #000;padding:2mm}
.sheet .iss li{margin:.6mm 0}
.sheet .iss .lv{display:inline-block;border:1.5px solid #000;padding:0 1.5mm;font-weight:700;margin-right:1.5mm;font-size:8pt}
.sheet .iss .lv.er{background:#000;color:#fff}
@media (max-width:640px){
  .top h1{font-size:20px}
  nav.tabs button{padding:8px 9px;font-size:13px}
}
@media print{
  @page{margin:8mm}
  html,body{background:#fff!important}
  body{padding:0!important}
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible}
  .sheetbox{padding:0!important;background:none!important;overflow:visible!important}
  .sheet{position:absolute;left:0;top:0;width:100%!important;min-height:0!important;box-shadow:none!important;padding:0!important}
  .sheet table.tt td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
<style id="pgs">@page{size:A4 landscape}</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';
/* ================= 定数 ================= */
var KEY='shienKoryuJikanwari.v1';
var DAYS=['月','火','水','木','金','土'];
var SYM={exchange:'交',support:'支',other:'他',unset:'？'};
var MODES={A:'A 交流学級での参加を基本とする',B:'B 支援学級での学習を基本とする',C:'C 個別に判断する',D:'D その他'};
var MODE_SHORT={A:'A 交流',B:'B 支援',C:'C 個別判断',D:'D その他'};
var SRC={exception:'例外',student:'個別',school:'学校ルール',none:'未設定'};
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ================= 初期データ ================= */
var DEFAULT_ROWS=function(){return ['1校時','2校時','3校時','4校時','給食','5校時','6校時'].map(function(l,i){return {id:['r1','r2','r3','r4','rk','r5','r6'][i],label:l};});};
var ITEM_DEFS=[
 ['国語','教科'],['算数／数学','教科'],['社会','教科'],['理科','教科'],['生活','教科'],['音楽','教科'],['図画工作／美術','教科'],
 ['体育／保健体育','教科'],['外国語','教科'],['技術・家庭','教科'],['その他（教科）','教科'],
 ['道徳','活動'],['学級活動','活動'],['児童会・生徒会活動','活動'],['クラブ活動','活動'],['総合的な学習の時間','活動'],
 ['学校行事','活動'],['給食','活動'],['休み時間','活動'],['自立活動','活動'],['その他（活動）','活動']
];
function makeRules(modes){
  return ITEM_DEFS.map(function(d){return {id:uid(),name:d[0],kind:d[1],mode:(modes&&modes[d[0]])||'C',note:''};});
}
var SAMPLE_MODES={'国語':'B','算数／数学':'B','道徳':'A','学級活動':'A','児童会・生徒会活動':'A','学校行事':'A','給食':'A','休み時間':'A','自立活動':'B','その他（活動）':'D'};
function newStudent(name){
  return {id:uid(),name:name||'新しい児童生徒',kind:'support',enrollName:'支援学級',hostGrade:'',hostCls:'',useRules:true,memo:'',plan:{},slots:{},exceptions:{},memos:{}};
}
function sampleData(){
  var rules=makeRules(SAMPLE_MODES);
  var rows=DEFAULT_ROWS();
  function R(n){for(var i=0;i<rules.length;i++){if(rules[i].name===n)return rules[i].id;}throw new Error('no rule '+n);}
  function slotsFrom(grid){
    var s={};
    grid.forEach(function(day,di){day.forEach(function(cell,ri){
      if(!cell)return;
      s[di+'|'+rows[ri].id]=(Array.isArray(cell)?cell:[cell]).map(R);
    });});
    return s;
  }
  var M='算数／数学',PE='体育／保健体育',AR='図画工作／美術',TC='技術・家庭',EN='外国語',JI='自立活動',SO='総合的な学習の時間';
  var s1=newStudent('生徒A（見本1）');
  s1.hostGrade='1';s1.hostCls='3';s1.memo='見本1：社会と体育を交流学級で学習する例。確認画面の見本として、技術・家庭を未設定のままにしてあります。';
  s1.slots=slotsFrom([
    ['国語',M,'社会','理科','給食',PE,JI],
    [M,'国語','音楽','社会','給食',TC,'道徳'],
    ['国語','理科',PE,M,'給食',EN,'学級活動'],
    ['社会','国語',M,PE,'給食',JI,AR],
    ['国語',M,'理科','社会','給食',PE,JI]
  ]);
  s1.plan[R('社会')]={where:'exchange',grade:'',cls:'',other:'',note:'教科担任と相談済み'};
  s1.plan[R(PE)]={where:'exchange',grade:'',cls:'',other:'',note:''};
  s1.plan[R('理科')]={where:'support',grade:'',cls:'',other:'',note:''};
  s1.plan[R('音楽')]={where:'support',grade:'',cls:'',other:'',note:''};
  s1.plan[R(EN)]={where:'support',grade:'',cls:'',other:'',note:''};
  s1.plan[R(AR)]={where:'support',grade:'',cls:'',other:'',note:''};
  s1.exceptions['3|r1|'+R('社会')]={where:'support',grade:'',cls:'',other:'',note:'この日だけ支援学級で学習（見本）'};
  var s2=newStudent('生徒B（見本2）');
  s2.hostGrade='2';s2.hostCls='1';s2.memo='見本2：道徳・学級活動は学校ルールに任せ、総合的な学習の時間だけ個別に設定した例。給食は個別に支援学級としています。';
  s2.slots=slotsFrom([
    ['国語',M,'理科','社会','給食','音楽',JI],
    [M,'国語','社会','理科','給食',AR,'道徳'],
    ['国語',M,PE,EN,'給食','学級活動',JI],
    ['国語',M,'理科','社会','給食',JI,PE],
    ['国語',M,EN,AR,'給食',SO,SO]
  ]);
  [['理科','support'],['社会','support'],['音楽','support'],[AR,'support'],[PE,'exchange'],[EN,'support'],[SO,'exchange'],['給食','support']].forEach(function(p){
    s2.plan[R(p[0])]={where:p[1],grade:'',cls:'',other:'',note:p[0]==='給食'?'配慮のため支援学級で食べる（見本）':''};
  });
  var s3=newStudent('生徒C（見本3）');
  s3.kind='regular';s3.enrollName='通常学級';s3.hostGrade='3';s3.hostCls='2';s3.useRules=false;
  s3.memo='見本3：通常学級に在籍し、一部の時間を支援学級で学習する例。水曜4校時は、確認画面の見本として重複を入れてあります。';
  s3.slots=slotsFrom([
    ['国語',M,'社会','理科','給食',PE,SO],
    [M,'国語','音楽','社会','給食',AR,'道徳'],
    ['国語','理科',PE,[M,JI],'給食',EN,'学級活動'],
    ['社会','国語',M,PE,'給食','理科',TC],
    ['国語',M,'理科','社会','給食',JI,'学級活動']
  ]);
  ['国語',M,'社会','理科','音楽',AR,PE,EN,TC,SO,'道徳','学級活動','給食'].forEach(function(n){
    s3.plan[R(n)]={where:'exchange',grade:'',cls:'',other:'',note:''};
  });
  s3.plan[R(JI)]={where:'support',grade:'',cls:'',other:'',note:''};
  s3.exceptions['1|r1|'+R(M)]={where:'support',grade:'',cls:'',other:'',note:'数学は少人数で（見本）'};
  s3.exceptions['3|r3|'+R(M)]={where:'support',grade:'',cls:'',other:'',note:''};
  return {school:{name:'見本中学校',type:'中学校',days:5,rows:rows},rules:rules,students:[s1,s2,s3]};
}
function blankData(){
  return {school:{name:'',type:'中学校',days:5,rows:DEFAULT_ROWS()},rules:makeRules({}),students:[newStudent('児童生徒1')]};
}

/* ================= 状態 ================= */
var S, UI={tab:'timetable',sid:null,mode:'teacher',edit:null,confirm:null,hl:null,scope:'one',
  opt:{src:true,memo:true,place:true,host:true},printType:'child',orient:{child:'land',teacher:'land',items:'port'},msg:''};
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&d.school&&d.rules&&d.students){return d;}}}catch(e){}
  return sampleData();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ruleById(id){for(var i=0;i<S.rules.length;i++){if(S.rules[i].id===id)return S.rules[i];}return null;}
function cur(){
  var st=null;for(var i=0;i<S.students.length;i++){if(S.students[i].id===UI.sid)st=S.students[i];}
  if(!st){st=S.students[0]||null;UI.sid=st?st.id:null;}
  return st;
}
function sIdx(st){return S.students.indexOf(st);}

/* ================= 判定ロジック（優先順位：例外 > 個別 > 学校ルール > 未設定） ================= */
function clsLabel(g,c,full){
  var gs=g?(/^\d+$/.test(String(g))?g+'年':g):'';
  var cs=c?(/^\d+$/.test(String(c))?c+'組':c):'';
  if(!gs&&!cs)return '';
  return (full&&S.school.type?S.school.type:'')+gs+cs;
}
function whereName(st,w){
  if(w==='exchange')return st&&st.kind==='regular'?'在籍学級':'交流学級';
  if(w==='support')return '支援学級';
  if(w==='other')return 'その他の場所';
  return '未設定';
}
function fromObj(st,o,source,mode){
  var pl=st.plan[o._item]||{};
  return {where:o.where,grade:o.grade||pl.grade||st.hostGrade||'',cls:o.cls||pl.cls||st.hostCls||'',
          other:o.other||'',note:o.note||'',source:source,mode:mode};
}
function resolve(st,itemId,key){
  var rule=ruleById(itemId);
  var mode=rule?rule.mode:null;
  if(key){
    var ex=st.exceptions[key+'|'+itemId];
    if(ex&&ex.where&&ex.where!=='unset'){var e2=Object.assign({_item:itemId},ex);return fromObj(st,e2,'exception',mode);}
  }
  var pl=st.plan[itemId];
  if(pl&&pl.where&&pl.where!=='unset'){var p2=Object.assign({_item:itemId},pl);return fromObj(st,p2,'student',mode);}
  if(st.useRules&&rule){
    if(rule.mode==='A')return fromObj(st,{_item:itemId,where:'exchange'},'school',mode);
    if(rule.mode==='B')return fromObj(st,{_item:itemId,where:'support'},'school',mode);
  }
  return {where:'unset',grade:'',cls:'',other:'',note:'',source:'none',mode:mode};
}
function ruleWhere(rule){return rule&&rule.mode==='A'?'exchange':(rule&&rule.mode==='B'?'support':null);}
function planDiff(st,itemId){
  var rule=ruleById(itemId),pl=st.plan[itemId];
  if(!rule||!st.useRules||!pl||!pl.where||pl.where==='unset')return false;
  var rw=ruleWhere(rule);
  return !!rw&&pl.where!==rw;
}
function sameResult(a,b){
  return a.where===b.where&&(a.where!=='exchange'||(a.grade===b.grade&&a.cls===b.cls))&&(a.where!=='other'||a.other===b.other);
}
function placeText(st,r,full,withName){
  if(r.where==='exchange'){var c=clsLabel(r.grade,r.cls,full);return c?(withName===false?c:whereName(st,'exchange')+'・'+c):whereName(st,'exchange');}
  if(r.where==='other')return r.other||'その他の場所';
  return whereName(st,r.where);
}
function rowLabel(r){return r.label;}
function dayName(i){return DAYS[i]+'曜';}
function slotKeys(){
  var ks=[];for(var d=0;d<S.school.days;d++){S.school.rows.forEach(function(r){ks.push(d+'|'+r.id);});}
  return ks;
}
function usedItems(st){
  var u={};Object.keys(st.slots).forEach(function(k){var d=+k.split('|')[0];if(d>=S.school.days)return;(st.slots[k]||[]).forEach(function(id){u[id]=(u[id]||0)+1;});});
  return u;
}
function issues(st){
  var out=[];
  function add(level,code,msg,fix){out.push({level:level,code:code,msg:msg,fix:fix,sid:st.id,sname:st.name});}
  var used=usedItems(st);
  slotKeys().forEach(function(key){
    var items=st.slots[key]||[];if(!items.length)return;
    var parts=key.split('|');var row=S.school.rows.filter(function(r){return r.id===parts[1];})[0];
    var when=dayName(+parts[0])+' '+(row?rowLabel(row):'');
    var rs=items.map(function(id){return resolve(st,id,key);});
    if(items.length>1){
      var diff=false;for(var i=1;i<rs.length;i++){if(!sameResult(rs[0],rs[i]))diff=true;}
      var names=items.map(function(id){var r=ruleById(id);return r?r.name:'（削除済み）';}).join('・');
      add(diff?'error':'warn','dup',when+'：同じ時間帯に複数の活動が登録されています（'+names+'）'+(diff?'。学習場所も食い違っています。':'。'),{tab:'timetable',key:key});
    }
    items.forEach(function(id,i){
      var r=rs[i],rule=ruleById(id),nm=rule?rule.name:'（削除済み）';
      if(r.where==='unset'){
        var why=rule&&rule.mode==='C'?'（学校共通ルールは「個別に判断する」です）':(rule&&rule.mode==='D'?'（学校共通ルールは「その他」です）':'');
        add('error','noplace',when+' '+nm+'：学習場所が未設定です'+why,{tab:'timetable',key:key});
      }else if(r.where==='exchange'&&(!r.grade||!r.cls)){
        add('error','nohost',when+' '+nm+'：交流先の学年・組が未設定です',{tab:'timetable',key:key});
      }else if(r.where==='other'&&!r.other){
        add('warn','noother',when+' '+nm+'：「その他の場所」の名前が未入力です',{tab:'timetable',key:key});
      }
      var ex=st.exceptions[key+'|'+id];
      if(ex&&ex.where&&ex.where!=='unset'){
        var base=resolve(st,id,null);
        if(!sameResult(base,r)){
          add('warn','exc',when+' '+nm+'：この時間だけ通常の設定（'+placeText(st,base,true)+'）と異なります → '+placeText(st,r,true),{tab:'timetable',key:key});
        }
      }
    });
  });
  S.rules.forEach(function(rule){
    if(planDiff(st,rule.id)){
      var pl=st.plan[rule.id];
      add('warn','diff',rule.name+'：学校共通ルール（'+MODE_SHORT[rule.mode]+'）と個別設定（'+whereName(st,pl.where)+'）が異なります',{tab:'plan',item:rule.id});
    }
    var p=st.plan[rule.id];
    if(p&&p.where==='exchange'&&!used[rule.id]&&!(p.grade||st.hostGrade)||p&&p.where==='exchange'&&!used[rule.id]&&!(p.cls||st.hostCls)){
      add('error','nohost',rule.name+'：交流先の学年・組が未設定です',{tab:'plan',item:rule.id});
    }
  });
  if(st.kind==='support'&&(!st.hostGrade||!st.hostCls)){
    add('warn','nohostdef','交流学級の基本（学年・組）が未入力です',{tab:'students'});
  }
  out.sort(function(a,b){return (a.level==='error'?0:1)-(b.level==='error'?0:1);});
  return out;
}
function countIssues(list){var e=0,w=0;list.forEach(function(i){if(i.level==='error')e++;else w++;});return {e:e,w:w};}
